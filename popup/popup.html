<!--
  Priority Scorer — popup
  -----------------------
  The window that opens when you click the extension's toolbar icon. It shows
  all your saved scores as a ranked list, with search, sort, method filter,
  per-row edit/delete, and an Export-to-CSV button.

  Scripts are linked at the bottom (extension popups don't allow inline scripts).
  The shared scoring modules load before popup.js so it can reuse them.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Priority Scorer</title>
    <link rel="stylesheet" href="../lib/scoreForm.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="pp-header">
      <span class="pp-logo">PS</span>
      <h1 class="pp-title">Priority Scorer</h1>
      <button id="pp-export" class="pp-export" type="button" title="Export all scores to a CSV file">
        Export CSV
      </button>
    </header>

    <!-- Controls: search, sort, and method filter. Hidden when there's nothing
         saved yet (popup.js toggles this). -->
    <div id="pp-controls" class="pp-controls">
      <input
        id="pp-search"
        class="pp-search"
        type="search"
        placeholder="Search by title or ID…"
        autocomplete="off"
      />
      <div class="pp-control-row">
        <label class="pp-control">
          Sort
          <select id="pp-sort">
            <option value="score">Score (high → low)</option>
            <option value="date">Date (newest first)</option>
          </select>
        </label>
        <label class="pp-control">
          Method
          <select id="pp-filter">
            <option value="ALL">All</option>
            <option value="RICE">RICE</option>
            <option value="ICE">ICE</option>
          </select>
        </label>
      </div>
    </div>

    <main id="pp-content" class="pp-content">
      <!-- popup.js fills this in -->
    </main>

    <!-- Load the shared helpers first, then the popup logic. -->
    <script src="../lib/storage.js"></script>
    <script src="../lib/scoring.js"></script>
    <script src="../lib/scoreForm.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
